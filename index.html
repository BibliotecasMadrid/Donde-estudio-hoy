// ─────────────────────────────────────────────
//  SLUGS — deben ser IDÉNTICOS a build.py para que
//  las URLs del panel coincidan con las páginas generadas.
// ─────────────────────────────────────────────
const BASE_URL = 'https://bibliotecasmadrid.github.io/Donde-estudio-hoy/';
const PREFIJOS = ["biblioteca pública ", "biblioteca municipal ", "salas de estudio ",
  "sala de estudio del ", "sala de estudio de la ", "sala de estudio ", "sala de lectura ", "biblioteca "];

function slugify(nombre) {
  let base = nombre;
  const low = nombre.toLowerCase();
  for (const p of PREFIJOS) { if (low.startsWith(p)) { base = nombre.slice(p.length); break; } }
  base = base.normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase();
  base = base.replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  return base || 'centro';
}

const slugOf = new Map(), placeOf = new Map();
(function buildSlugs() {
  const seen = {};
  lugares.forEach(d => {
    let s = slugify(d.nombre);
    if (seen[s]) { seen[s]++; s = s + '-' + seen[s]; } else { seen[s] = 1; }
    slugOf.set(d, s); placeOf.set(s, d);
  });
})();

function getTodayInfo(horarioStr, date = new Date()) {
  const day = date.getDay(); // 0: Dom, 1: Lun, ..., 6: Sab
  const month = date.getMonth(); // 0-11. 5: Jun, 6: Jul, 7: Ago, 8: Sep
  const dayOfMonth = date.getDate();
  const currentMinutes = date.getHours() * 60 + date.getMinutes();
  
  const isSummer = (month === 6 || month === 7 || (month === 5 && dayOfMonth >= 15) || (month === 8 && dayOfMonth <= 15));
  const isJulyAugust = (month === 6 || month === 7);
  
  const h = horarioStr.toLowerCase();
  
  if (h.includes('consultar') || h.includes('teléfono') || h.includes('telefono')) {
    return {
      statusText: 'Consultar',
      statusClass: 'status-info',
      todaySchedule: 'Consultar horario por teléfono',
      isOpen: null
    };
  }
  
  function parseIntervals(text) {
    const intervals = [];
    const re = /(\d{1,2})(?::(\d{2}))?\s*[–\-—a]\s*(\d{1,2})(?::(\d{2}))?h?/gi;
    let m;
    while ((m = re.exec(text)) !== null) {
      const startH = parseInt(m[1], 10);
      const startM = m[2] ? parseInt(m[2], 10) : 0;
      const endH = parseInt(m[3], 10);
      const endM = m[4] ? parseInt(m[4], 10) : 0;
      intervals.push({
        startMin: startH * 60 + startM,
        endMin: endH * 60 + endM,
        startStr: `${startH}:${startM < 10 ? '0' : ''}${startM}`,
        endStr: `${endH}:${endM < 10 ? '0' : ''}${endM}`
      });
    }
    return intervals;
  }
  
  const lines = horarioStr.split('\n');
  const mainLine = lines[0];
  
  // 1. Domingo (0)
  if (day === 0) {
    if (h.includes('dom') || h.includes('fines de semana') || h.includes('lun–dom') || h.includes('lun-dom')) {
      let sundayText = '';
      if (h.includes('sáb–dom') || h.includes('sab-dom') || h.includes('sáb y dom') || h.includes('sab y dom')) {
        const m = horarioStr.match(/S[áa]b[–\-—]Dom\s+([^\n·]+)/i);
        if (m) sundayText = m[1];
      } else if (h.includes('fines de semana')) {
        const m = horarioStr.match(/Fines de semana[^\d]*(\d[^\n·]+)/i);
        if (m) sundayText = m[1];
      } else if (h.includes('dom') && !h.includes('cerrado')) {
        const m = horarioStr.match(/Dom\s+([^\n·]+)/i);
        if (m) sundayText = m[1];
      } else if (h.includes('lun–dom') || h.includes('lun-dom')) {
        sundayText = mainLine;
      }
      
      if (sundayText) {
        const intervals = parseIntervals(sundayText);
        if (intervals.length > 0) {
          const isOpen = intervals.some(iv => currentMinutes >= iv.startMin && currentMinutes < iv.endMin);
          const schedFormatted = intervals.map(iv => `${iv.startStr}–${iv.endStr}h`).join(' y ');
          return {
            statusText: isOpen ? 'Abierto' : 'Cerrado',
            statusClass: isOpen ? 'status-open' : 'status-closed',
            todaySchedule: `${schedFormatted}`,
            isOpen
          };
        }
      }
    }
    return {
      statusText: 'Cerrado',
      statusClass: 'status-closed',
      todaySchedule: 'Cerrado hoy',
      isOpen: false
    };
  }
  
  // 2. Sábado (6)
  if (day === 6) {
    if (h.includes('sáb') || h.includes('sab') || h.includes('fines de semana') || h.includes('lun–dom') || h.includes('lun-dom') || h.includes('lun–sáb') || h.includes('lun-sab')) {
      let sabText = '';
      if (h.includes('sáb–dom') || h.includes('sab-dom') || h.includes('sáb y dom') || h.includes('sab y dom')) {
        const m = horarioStr.match(/S[áa]b[–\-—]Dom\s+([^\n·]+)/i);
        if (m) sabText = m[1];
      } else if (h.includes('sáb') || h.includes('sab')) {
        const m = horarioStr.match(/S[áa]b\s+([^\n·\(\)]+)/i);
        if (m) sabText = m[1];
      } else if (h.includes('fines de semana')) {
        const m = horarioStr.match(/Fines de semana[^\d]*(\d[^\n·\(\)]+)/i);
        if (m) sabText = m[1];
      } else if (h.includes('lun–sáb') || h.includes('lun-sab') || h.includes('lun–dom') || h.includes('lun-dom')) {
        sabText = mainLine;
      }
      
      if (sabText) {
        const intervals = parseIntervals(sabText);
        if (intervals.length > 0) {
          const isOpen = intervals.some(iv => currentMinutes >= iv.startMin && currentMinutes < iv.endMin);
          const schedFormatted = intervals.map(iv => `${iv.startStr}–${iv.endStr}h`).join(' y ');
          return {
            statusText: isOpen ? 'Abierto' : 'Cerrado',
            statusClass: isOpen ? 'status-open' : 'status-closed',
            todaySchedule: `${schedFormatted}`,
            isOpen
          };
        }
      }
    }
    return {
      statusText: 'Cerrado',
      statusClass: 'status-closed',
      todaySchedule: 'Cerrado hoy',
      isOpen: false
    };
  }
  
  // 3. Lunes a Viernes (1-5)
  if (day === 5 && h.includes('vie 9–14:30h')) {
    const intervals = parseIntervals('9–14:30h');
    const isOpen = intervals.some(iv => currentMinutes >= iv.startMin && currentMinutes < iv.endMin);
    return {
      statusText: isOpen ? 'Abierto' : 'Cerrado',
      statusClass: isOpen ? 'status-open' : 'status-closed',
      todaySchedule: '9:00–14:30h',
      isOpen
    };
  }
  
  let lineToUse = mainLine;
  if (isSummer) {
    const summerLine = lines.find(l => l.toLowerCase().includes('verano') || (isJulyAugust && (l.toLowerCase().includes('julio') || l.toLowerCase().includes('agosto'))));
    if (summerLine) {
      lineToUse = summerLine;
    }
  }
  
  let weekdayPart = lineToUse;
  if (lineToUse.includes('·')) {
    weekdayPart = lineToUse.split('·')[0];
  }
  
  const intervals = parseIntervals(weekdayPart);
  if (intervals.length > 0) {
    const isOpen = intervals.some(iv => currentMinutes >= iv.startMin && currentMinutes < iv.endMin);
    const schedFormatted = intervals.map(iv => `${iv.startStr}–${iv.endStr}h`).join(' y ');
    return {
      statusText: isOpen ? 'Abierto' : 'Cerrado',
      statusClass: isOpen ? 'status-open' : 'status-closed',
      todaySchedule: `${schedFormatted}`,
      isOpen
    };
  }
  
  return {
    statusText: 'Abierto',
    statusClass: 'status-open',
    todaySchedule: mainLine,
    isOpen: true
  };
}

// ─────────────────────────────────────────────
//  PANEL LATERAL
// ─────────────────────────────────────────────
const panel = document.getElementById('panel');
const panelBody = document.getElementById('panel-body');

function panelHtml(d) {
  const c = colores[d.tipo];
  const today = getTodayInfo(d.horario);
  const horarioHtml = d.horario.split('\n').map(l => `<div>${l}</div>`).join('');
  const label = d.web ? 'Web oficial' : 'Buscar web y horario';
  return `
    <span class="panel-badge" style="background:${c.fill}">${c.label}</span>
    <h2 class="panel-name">${d.nombre}</h2>
    <p class="panel-address">${d.distrito} · ${d.direccion}</p>
    
    <div class="panel-today">
      <div class="panel-today-head">
        <span class="panel-today-title">HOY</span>
        <span class="status-badge ${today.statusClass}">${today.statusText}</span>
      </div>
      <div class="panel-today-hours">${today.todaySchedule}</div>
    </div>

    <div class="panel-schedule">
      <div class="panel-label">Horario habitual</div>
      ${horarioHtml}
    </div>
    
    <div class="panel-actions">
      <a class="panel-link" style="background:${c.fill}" href="${webUrl(d)}" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        ${label}
      </a>
      <a class="panel-page" href="${slugOf.get(d)}">Página de este centro ↗</a>
    </div>`;
}

let current = null;
function openPlace(d, push) {
  current = d;
  panelBody.innerHTML = panelHtml(d);
  panel.classList.add('open');
  panel.setAttribute('aria-hidden', 'false');
  if (push) history.pushState({ slug: slugOf.get(d) }, '', slugOf.get(d));
  map.panTo([d.lat, d.lng], { animate: true });
}
function closePanel(push) {
  current = null;
  panel.classList.remove('open');
  panel.setAttribute('aria-hidden', 'true');
  if (push) history.pushState({}, '', './');
}

document.getElementById('panel-close').addEventListener('click', () => closePanel(true));
document.addEventListener('keydown', e => { if (e.key === 'Escape' && current) closePanel(true); });
map.on('click', () => { if (current) closePanel(true); });

// ─────────────────────────────────────────────
//  MARCADORES
// ─────────────────────────────────────────────
lugares.forEach(d => {
  L.marker([d.lat, d.lng], { icon: makeIcon(d.tipo), title: d.nombre })
    .addTo(map)
    .on('click', () => openPlace(d, true));
});

// Sincronizar con la URL: back/forward del navegador y enlaces #slug
function placeFromUrl() {
  let slug = location.hash.slice(1);
  if (!slug) {
    const path = location.pathname.replace(/\/+$/, '');
    slug = path.substring(path.lastIndexOf('/') + 1);
  }
  return placeOf.get(decodeURIComponent(slug)) || null;
}
window.addEventListener('popstate', () => {
  const d = placeFromUrl();
  if (d) openPlace(d, false); else closePanel(false);
});
(function initFromUrl() {
  const d = placeFromUrl();
  if (d) { openPlace(d, false); history.replaceState({ slug: slugOf.get(d) }, '', slugOf.get(d)); }
})();

// ─────────────────────────────────────────────
//  SEO: datos estructurados (ItemList) generados
//  desde el propio array, sin duplicar datos.
// ─────────────────────────────────────────────
(function injectStructuredData() {
  const itemList = {
    "@context": "https://schema.org",
    "@type": "ItemList",
    "name": "Bibliotecas y salas de estudio en Madrid",
    "numberOfItems": lugares.length,
    "itemListElement": lugares.map((d, i) => ({
      "@type": "ListItem",
      "position": i + 1,
      "item": {
        "@type": "Library",
        "name": d.nombre,
        "description": "Horario: " + d.horario.replace(/\n/g, ' '),
        "address": {
          "@type": "PostalAddress",
          "streetAddress": d.direccion,
          "addressLocality": "Madrid",
          "addressRegion": "Comunidad de Madrid",
          "addressCountry": "ES"
        },
        "geo": { "@type": "GeoCoordinates", "latitude": d.lat, "longitude": d.lng },
        "url": BASE_URL + slugOf.get(d)
      }
    }))
  };
  const s = document.createElement('script');
  s.type = 'application/ld+json';
  s.textContent = JSON.stringify(itemList);
  document.head.appendChild(s);
})();
</script>
