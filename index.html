  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />

  <style>
    :root {
      --c-biblioteca: #2563EB;
      --c-sala:       #059669;
      --c-universidad:#7C3AED;
      --c-ubicacion:  #EA4335;
      --mobile-map-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
      --ink:    #1A1F36;
      --ink-2:  #5A6172;
      --ink-3:  #9AA0AE;
      --line:   #ECEEF2;
      --card:   rgba(255,255,255,0.88);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #map { height: 100vh; width: 100%; background: #EAEDF0; }

    /* ── Floating header ─────────────────────────── */
    .topbar {
      position: absolute;
      top: 14px; left: 14px;
      z-index: 1000;
      background: var(--card);
      backdrop-filter: blur(14px) saturate(160%);
      -webkit-backdrop-filter: blur(14px) saturate(160%);
      padding: 12px 18px;
      border-radius: 16px;
      box-shadow: 0 6px 28px rgba(20,30,60,0.14), 0 0 0 1px rgba(255,255,255,0.6) inset;
    }
    .topbar h1 {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.01em;
      color: var(--ink);
      line-height: 1.15;
    }
    .topbar p {
      font-size: 11.5px;
      color: var(--ink-2);
      margin-top: 2px;
    }
    .topbar-links { display: flex; gap: 10px; margin-top: 6px; }
    .topbar-links a {
      color: #31527f; font-size: 10.5px; font-weight: 750;
      text-decoration: none; border-bottom: 1px solid rgba(49,82,127,.3);
    }
    .topbar-links a:hover, .topbar-links a:focus-visible { color: #1d4ed8; border-color: currentColor; }
    .mobile-link-label { display: none; }
    .topbar-search-slot { display: none; }

    /* ── Legend ──────────────────────────────────── */
    .legend {
      position: absolute;
      bottom: 22px;
      left: 14px;
      z-index: 1000;
      background: var(--card);
      backdrop-filter: blur(14px) saturate(160%);
      -webkit-backdrop-filter: blur(14px) saturate(160%);
      padding: 11px 14px;
      border-radius: 14px;
      box-shadow: 0 6px 28px rgba(20,30,60,0.14), 0 0 0 1px rgba(255,255,255,0.6) inset;
      font-size: 12.5px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .legend-item { display: flex; align-items: center; gap: 9px; color: var(--ink); font-weight: 500; }
    .dot {
      width: 12px; height: 12px; border-radius: 50%;
      box-shadow: 0 0 0 2px #fff, 0 1px 3px rgba(0,0,0,0.3);
      flex-shrink: 0;
    }

    /* ── Markers ─────────────────────────────────── */
    .study-marker {
      filter: drop-shadow(0 2px 3px rgba(20,30,60,0.35));
      cursor: pointer;
    }
    .study-marker svg { transition: transform 0.12s ease; transform-origin: 50% 50%; }
    .study-marker:hover svg { transform: scale(1.22); }
    .study-marker-selected {
      filter: drop-shadow(0 5px 6px rgba(20,30,60,0.4));
    }
    .study-marker svg,
    .user-location-marker svg {
      display: block;
      overflow: visible;
    }
    .user-location-marker {
      filter: drop-shadow(0 4px 5px rgba(20,30,60,0.32));
      cursor: pointer;
    }
    .marker-tap-feedback svg {
      animation: marker-tap-bounce 0.4s cubic-bezier(.22,.8,.35,1);
      transform-origin: 50% 100%;
    }
    @keyframes marker-tap-bounce {
      0%   { transform: translateY(0) scale(1); }
      38%  { transform: translateY(-5px) scale(1.13); }
      68%  { transform: translateY(1px) scale(0.98); }
      100% { transform: translateY(0) scale(1); }
    }
    @keyframes marker-tap-flash {
      0%, 100% { opacity: 1; filter: brightness(1); }
      50% { opacity: 0.68; filter: brightness(1.25); }
    }
    @media (prefers-reduced-motion: reduce) {
      .marker-tap-feedback svg {
        animation: marker-tap-flash 0.32s ease;
        transform: none;
      }
    }
    .user-location-tooltip {
      padding: 6px 9px;
      border: 0;
      border-radius: 9px;
      box-shadow: 0 5px 18px rgba(20,30,60,0.18);
      color: var(--ink);
      font-size: 12px;
      font-weight: 700;
    }

    /* ── Popup ───────────────────────────────────── */
    .leaflet-popup-content-wrapper {
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(20,30,60,0.22);
      padding: 0;
      overflow: hidden;
    }
    .leaflet-popup-content { margin: 0; min-width: 244px; max-width: 300px; }
    .leaflet-popup-tip { box-shadow: 0 12px 40px rgba(20,30,60,0.22); }
    .popup-inner { padding: 15px 17px 14px; }
    .popup-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 3px 9px;
      border-radius: 999px;
      margin-bottom: 8px;
      color: #fff;
    }
    .popup-name {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.01em;
      color: var(--ink);
      margin-bottom: 6px;
      line-height: 1.3;
    }
    .popup-address {
      font-size: 11.5px;
      color: var(--ink-3);
      margin-bottom: 11px;
      line-height: 1.45;
    }
    .popup-schedule {
      font-size: 12.5px;
      color: var(--ink);
      border-top: 1px solid var(--line);
      padding-top: 10px;
      line-height: 1.65;
    }
    .schedule-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--ink-3);
      margin-bottom: 4px;
    }
    .leaflet-popup-content a.popup-link,
    .leaflet-popup-content a.popup-link:hover,
    .leaflet-popup-content a.popup-link:visited {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-top: 12px;
      font-size: 12.5px;
      font-weight: 600;
      text-decoration: none;
      color: #fff;
      padding: 7px 13px;
      border-radius: 999px;
      transition: filter 0.12s ease;
    }
    .leaflet-popup-content a.popup-link:hover { filter: brightness(1.08); }
    .popup-link svg { width: 13px; height: 13px; }

    /* ── Panel lateral ───────────────────────────── */
    .panel {
      position: fixed; top: 0; right: 0; height: 100%;
      width: 384px; max-width: 100%;
      background: #fff; z-index: 1200;
      box-shadow: -12px 0 44px rgba(20,30,60,0.18);
      transform: translateX(102%);
      transition: transform 0.28s cubic-bezier(.4,0,.2,1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .panel.open { transform: translateX(0); }
    .panel-close {
      position: absolute; top: 14px; right: 14px;
      width: 34px; height: 34px; border: none; border-radius: 50%;
      background: #FEE2E2; color: #DC2626; font-size: 17px; line-height: 1;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      z-index: 10;
    }
    .panel-close:hover { background: #FECACA; color: #B91C1C; }
    .panel-drag-handle { display: none; }
    .panel-inner {
      padding: 56px 26px 32px;
      flex: 1;
      overflow-y: auto;
      overscroll-behavior-y: contain;
      height: 100%;
    }
    .panel-badge {
      display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: 0.06em;
      text-transform: uppercase; padding: 3px 10px; border-radius: 999px; color: #fff; margin-bottom: 12px;
    }
    .panel-name { font-size: 21px; font-weight: 800; letter-spacing: -0.01em; line-height: 1.25; color: var(--ink); margin-bottom: 8px; }
    .panel-address { font-size: 13px; color: var(--ink-3); margin-bottom: 16px; line-height: 1.5; }
    
    /* ── Sección HOY ───────────────────────────── */
    
    
    /* Cover foto limpia en el panel lateral */
    .panel-cover {
      position: relative;
      width: calc(100% + 48px);
      margin: -24px -24px 16px -24px;
      height: 160px;
      overflow: hidden;
      border-top-left-radius: 18px;
      border-top-right-radius: 18px;
      background: #E2E8F0;
    }
    .panel-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .panel-cover .panel-badge {
      position: absolute;
      bottom: 12px;
      left: 18px;
      margin-bottom: 0;
      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
      z-index: 2;
    }

    /* Atribucion del autor de la foto: la exigen los terminos de Google Places. */
    .panel-credit {
      position: absolute;
      right: 10px;
      bottom: 8px;
      z-index: 2;
      max-width: 58%;
      text-align: right;
      font-size: 10px;
      line-height: 1.25;
      color: rgba(255,255,255,0.88);
      text-shadow: 0 1px 3px rgba(0,0,0,0.75);
      pointer-events: none;
    }

    /* Capacidad / Aforo */
    .panel-capacity {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-2);
      background: #F1F5F9;
      padding: 5px 11px;
      border-radius: 8px;
      margin-bottom: 14px;
    }
    .panel-capacity svg {
      color: var(--ink-3);
      flex-shrink: 0;
    }

    .panel-today {
      display: block;
      text-decoration: none;
      color: inherit;
      background: #F8FAFC;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 15px;
      margin-bottom: 16px;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .panel-today:hover {
      background: #F1F5F9;
      border-color: #CBD5E1;
    }
    .panel-today-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 5px;
    }
    .panel-today-title {
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-2);
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11.5px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 999px;
    }
    .status-badge.status-open {
      background: #DCFCE7;
      color: #15803D;
    }
    .status-badge.status-open::before {
      content: "";
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #16A34A;
    }
    .status-badge.status-closed {
      background: #FEE2E2;
      color: #B91C1C;
    }
    .status-badge.status-closed::before {
      content: "";
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #DC2626;
    }
    .status-badge.status-info {
      background: #E0F2FE;
      color: #0369A1;
    }
    .panel-today-hours {
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
    }
    .panel-live-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 10.5px;
      font-weight: 700;
      color: #0369A1;
      background: #E0F2FE;
      padding: 3px 8px;
      border-radius: 6px;
      margin-top: 7px;
    }
    .panel-live-tag svg {
      width: 11px;
      height: 11px;
      fill: #0284C7;
      flex-shrink: 0;
    }
    .panel-live-week {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed var(--line);
    }
    .panel-week-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      margin-top: 4px;
    }
    .panel-week-table td {
      padding: 3px 2px;
      color: var(--ink-2);
    }
    .panel-week-table tr.day-row-today td {
      font-weight: 700;
      color: #1D4ED8;
    }
    .panel-week-table td.day-hours {
      text-align: right;
      font-weight: 600;
      color: var(--ink);
    }
    .panel-week-table tr.day-row-today td.day-hours {
      color: #1D4ED8;
    }

    .panel-schedule { font-size: 14px; color: var(--ink); border-top: 1px solid var(--line); padding-top: 14px; line-height: 1.7; }
    .panel-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-3); margin-bottom: 5px; }
    .panel-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 24px; }
    .panel-link, .panel-page {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      font-size: 13.5px; font-weight: 600; text-decoration: none; padding: 11px 16px; border-radius: 12px;
      transition: filter 0.12s ease, background 0.12s ease;
    }
    .panel-link { color: #fff; }
    .panel-link:hover { filter: brightness(1.08); }
    .panel-link svg, .panel-page svg { width: 14px; height: 14px; }
    .panel-page { background: #F1F3F7; color: var(--ink); }
    .panel-page:hover { background: #E7EAF0; }

    /* Zoom control: softer, modern */
    .leaflet-control-zoom a {
      border-radius: 10px !important;
      color: var(--ink) !important;
      box-shadow: 0 2px 8px rgba(20,30,60,0.12);
      border: none !important;
    }
    .leaflet-bar { border: none !important; }
    .leaflet-control-attribution {
      background: rgba(255,255,255,0.75) !important;
      border-radius: 8px 0 0 0;
      font-size: 10px;
    }

    /* ── Ubicación y buscador ──────────────────── */
    /* El margen deja sitio al globo del titulo. Es solo el valor de partida: al cargar,
       separarHerramientasDelTitulo() lo recalcula midiendo el globo de verdad. */
    .study-tools-control {
      position: relative;
      margin-top: 36px !important;
    }
    .study-tools-row {
      display: flex;
      align-items: stretch;
      gap: 8px;
    }
    .study-locate-button {
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 11px;
      background: #fff;
      color: var(--ink);
      box-shadow: 0 2px 8px rgba(20,30,60,0.12);
      cursor: pointer;
    }
    .study-locate-button:hover { background: #F1F5F9; }
    .study-locate-button.is-locating { color: #2563EB; }
    .study-locate-button.is-locating svg { animation: locate-button-pulse 0.8s ease-in-out infinite alternate; }
    @keyframes locate-button-pulse {
      from { opacity: 0.45; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1.05); }
    }
    .study-locate-button:focus-visible,
    .study-search-input:focus-visible,
    .study-search-result:focus-visible {
      outline: 3px solid rgba(37,99,235,0.35);
      outline-offset: 2px;
    }
    .study-search {
      position: relative;
      width: min(300px, calc(100vw - 84px));
    }
    .study-search-icon { display: none; }
    .study-search-input {
      display: block;
      width: 100%;
      height: 38px;
      padding: 0 12px;
      border: 1px solid rgba(148,163,184,0.55);
      border-radius: 11px;
      background: #fff;
      box-shadow: 0 2px 8px rgba(20,30,60,0.12);
      color: var(--ink);
      font: inherit;
      font-size: 13px;
    }
    .study-search-input::placeholder { color: var(--ink-3); }
    .study-search-input:focus {
      border-color: #2563EB;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.16), 0 2px 8px rgba(20,30,60,0.12);
      outline: none;
    }
    .study-search-results {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      z-index: 1001;
      width: 100%;
      max-height: min(360px, calc(100vh - 130px));
      overflow-y: auto;
      padding: 5px;
      border: 1px solid rgba(226,232,240,0.95);
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 12px 28px rgba(20,30,60,0.18);
    }
    .study-search-results[hidden] { display: none; }
    .study-search-result {
      width: 100%;
      display: block;
      padding: 9px 10px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      font: inherit;
      text-align: left;
    }
    .study-search-result:hover,
    .study-search-result.is-active {
      background: #EFF6FF;
    }
    /* Un tap de touchpad se desvia un par de pixeles entre el down y el up. Si caen en
       hijos distintos, el click se dispara en el ancestro comun y la seleccion se pierde.
       Neutralizando los hijos, el objetivo del evento es siempre el boton. */
    .study-search-result * { pointer-events: none; }
    .study-search-result-name {
      display: block;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.3;
    }
    .study-search-result-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 3px;
      color: var(--ink-2);
      font-size: 11px;
      line-height: 1.3;
    }
    .study-search-result-type {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex: 0 0 auto;
    }
    .study-search-result-type::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--type-color);
      content: "";
    }
    .study-search-result-district {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .study-search-empty {
      padding: 10px;
      color: var(--ink-2);
      font-size: 12px;
    }

    @media (max-width: 768px) {
      html, body, #map {
        height: var(--mobile-viewport-height, 100dvh);
      }
      .topbar {
        top: 8px;
        left: 8px;
        right: 8px;
        width: auto;
        max-width: none;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 0;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
      }
      .topbar h1 { display: none; }
      .topbar p { display: none; }
      .topbar-links {
        order: 2;
        gap: 6px;
        margin-top: 0;
        overflow-x: auto;
        padding: 0 1px 3px;
        white-space: nowrap;
        scrollbar-width: none;
      }

const map = L.map('map', {
  center: [40.4168, -3.7038],
  zoom: 12,
  zoomControl: true
});

// Base limpia y moderna (Positron). El proveedor y la clave se eligen en basemap.js.
Basemap.add(map, 'Datos: <a href="https://datos.madrid.es">datos.madrid.es</a> (CC BY 4.0)');

const colores = {
  biblioteca:  { fill: '#2563EB', label: 'Biblioteca pública' },
  sala:        { fill: '#059669', label: 'Sala de estudio'    },
  universidad: { fill: '#7C3AED', label: 'Universidad'        }
};

let suppressMapCloseUntil = 0;
const MOBILE_UI_MEDIA = window.matchMedia('(max-width: 768px)');
let locateButtonElement = null;

// Control de geolocalización y buscador local de centros.
const LocateAndSearchControl = L.Control.extend({
  options: { position: 'topleft' },
  onAdd: function (map) {
    const container = L.DomUtil.create('div', 'study-tools-control leaflet-control');
    container.setAttribute('aria-label', 'Herramientas del mapa');
    container.innerHTML = `
      <div class="study-tools-row">
        <button class="study-locate-button" type="button" title="Mi ubicación" aria-label="Centrar el mapa en mi ubicación">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
        </button>
        <div class="study-search">
          <svg class="study-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.7-3.7"></path></svg>
          <input id="library-search-input" class="study-search-input" type="search" placeholder="Buscar biblioteca o barrio" autocomplete="off" role="combobox" aria-label="Buscar una biblioteca, sala de estudio o barrio" aria-autocomplete="list" aria-expanded="false" aria-controls="library-search-results">
          <div id="library-search-results" class="study-search-results" role="listbox" aria-label="Resultados de búsqueda" hidden></div>
        </div>
      </div>`;

    const locateButton = container.querySelector('.study-locate-button');
    locateButtonElement = locateButton;
    const searchInput = container.querySelector('#library-search-input');
    const resultsList = container.querySelector('#library-search-results');
    let matchedPlaces = [];
    let activeResultIndex = -1;

    const normaliseSearch = value => String(value || '')
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .toLocaleLowerCase('es-ES')
      .replace(/[^a-z0-9]+/g, ' ')
      .trim();

    function closeSearchResults() {
      activeResultIndex = -1;
      resultsList.hidden = true;
      searchInput.setAttribute('aria-expanded', 'false');
      searchInput.removeAttribute('aria-activedescendant');
    }

    function renderSearchResults() {
      resultsList.replaceChildren();
      searchInput.removeAttribute('aria-activedescendant');

      if (!matchedPlaces.length) {
        const empty = document.createElement('div');
        empty.className = 'study-search-empty';
        empty.textContent = 'No hemos encontrado ningún centro con ese nombre.';
        resultsList.append(empty);
      } else {
        matchedPlaces.forEach((place, index) => {
          const result = document.createElement('button');
          const resultId = `library-search-option-${index}`;
          result.type = 'button';
          result.id = resultId;
          result.tabIndex = -1;
          result.className = `study-search-result${index === activeResultIndex ? ' is-active' : ''}`;
          result.dataset.searchIndex = String(index);
          result.setAttribute('role', 'option');
          result.setAttribute('aria-selected', String(index === activeResultIndex));

          const name = document.createElement('span');
          name.className = 'study-search-result-name';
          name.textContent = place.nombre;

          const meta = document.createElement('span');
          meta.className = 'study-search-result-meta';
          const type = document.createElement('span');
          type.className = 'study-search-result-type';
          type.style.setProperty('--type-color', colores[place.tipo].fill);
          type.textContent = colores[place.tipo].label;
          meta.append(type);

          if (place.distrito) {
            const district = document.createElement('span');
            district.className = 'study-search-result-district';
            district.textContent = `· ${place.distrito}`;
            meta.append(district);
          }

          result.append(name, meta);
          resultsList.append(result);
        });
      }

      resultsList.hidden = false;
      searchInput.setAttribute('aria-expanded', 'true');
      if (activeResultIndex >= 0 && matchedPlaces[activeResultIndex]) {
        searchInput.setAttribute('aria-activedescendant', `library-search-option-${activeResultIndex}`);
      }
    }

    function updateSearchResults() {
      const query = normaliseSearch(searchInput.value);
      activeResultIndex = -1;
      if (!query) {
        matchedPlaces = [];
        closeSearchResults();
        return;
      }

      matchedPlaces = lugares
        .filter(place => normaliseSearch(place.nombre).includes(query))
        .slice(0, 8);
      renderSearchResults();
    }

    function setActiveResult(direction) {
      if (!matchedPlaces.length) return;
      if (activeResultIndex === -1) {
        activeResultIndex = direction > 0 ? 0 : matchedPlaces.length - 1;
      } else {
        activeResultIndex = (activeResultIndex + direction + matchedPlaces.length) % matchedPlaces.length;
      }
      renderSearchResults();
      const active = document.getElementById(`library-search-option-${activeResultIndex}`);
      if (active) active.scrollIntoView({ block: 'nearest' });
    }

    function selectSearchResult(place, suppressPointerupMapClick = false) {
      if (!place) return;
      searchInput.value = place.nombre;
      closeSearchResults();
      // Al retirar el desplegable en pointerdown, el pointerup puede caer sobre el mapa y
      // sintetizar un click alli. Se ignora solo esa ventana minima para no cerrar la ficha.
      if (suppressPointerupMapClick) suppressMapCloseUntil = performance.now() + 300;

      // El panel se abre SIEMPRE y primero. Antes colgaba del callback de zoomToShowLayer,
      // que markercluster no llega a invocar cuando el marcador emerge del cluster sin
      // spiderfy: se elegia el centro del desplegable y no ocurria nada.
      openPlace(place, true, { focus: false });

      const marker = markerOfPlace.get(place);
      if (marker && clusterGroup.hasLayer(marker) && typeof clusterGroup.zoomToShowLayer === 'function') {
        try {
          focusAfterMarkerReveal(place, marker);
        } catch (_) {
          // Si el marcador no puede revelarse, el panel ya esta abierto y aun se centra el lugar.
          focusPlace(place);
        }
      } else {
        // Un filtro puede haber retirado el marcador del cluster, pero la ficha sigue siendo util.
        focusPlace(place);
      }
    }

    locateButton.addEventListener('click', () => {
      requestUserLocation();
    });
    searchInput.addEventListener('input', updateSearchResults);
    searchInput.addEventListener('focus', () => {
      if (normaliseSearch(searchInput.value)) updateSearchResults();
    });
    searchInput.addEventListener('blur', () => {
      window.setTimeout(closeSearchResults, 150);
    });
    searchInput.addEventListener('keydown', event => {
      if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
        event.preventDefault();
        event.stopPropagation();
        setActiveResult(event.key === 'ArrowDown' ? 1 : -1);
      } else if (event.key === 'Enter' && matchedPlaces.length) {
        event.preventDefault();
        event.stopPropagation();
        selectSearchResult(matchedPlaces[activeResultIndex >= 0 ? activeResultIndex : 0]);
      } else if (event.key === 'Escape') {
        event.preventDefault();
        event.stopPropagation();
        closeSearchResults();
      } else if (event.key === 'Tab') {
        closeSearchResults();
      }
    });
    // Seleccionar en 'click' no basta: con un tap de touchpad el puntero se mueve entre el
    // down y el up, el click acaba en el ancestro comun y solo queda el blur, que cierra la
    // lista sin elegir nada. Se elige ya en 'pointerdown' y se evita que el input pierda el
    // foco (asi no se arma el temporizador del blur).
    let selectedByPointer = false;
    resultsList.addEventListener('pointerdown', event => {
      selectedByPointer = false;
      // En tactil NO se adelanta la seleccion: preventDefault aqui impediria arrastrar
      // para hacer scroll dentro de la lista. Alli basta el click, que si llega entero.
      if (event.pointerType === 'touch' || event.button > 0) return;
      const result = event.target.closest('[data-search-index]');
      if (!result) return;
      event.preventDefault();
      selectedByPointer = true;
      selectSearchResult(matchedPlaces[Number(result.dataset.searchIndex)], true);
    });
    // Se conserva el click para clics sinteticos (tecnologia asistiva) que no pasan por
    // pointerdown; el flag evita elegir dos veces cuando llegan los dos eventos.
    resultsList.addEventListener('click', event => {
      if (selectedByPointer) { selectedByPointer = false; return; }
      const result = event.target.closest('[data-search-index]');
      if (!result) return;
      selectSearchResult(matchedPlaces[Number(result.dataset.searchIndex)]);
    });

    // El control es interactivo: sus gestos no deben arrastrar, hacer zoom ni cerrar el mapa.
    L.DomEvent.disableClickPropagation(container);
    L.DomEvent.disableScrollPropagation(container);
    ['keydown', 'keyup', 'keypress'].forEach(type => {
      container.addEventListener(type, event => event.stopPropagation());
    });
    return container;
  }
});

let userMarker = null;
let lastKnownUserLocation = null;
let locationRequestSequence = 0;
const FAST_LOCATION_OPTIONS = { enableHighAccuracy: false, maximumAge: 5 * 60 * 1000, timeout: 5000 };
const PRECISE_LOCATION_OPTIONS = { enableHighAccuracy: true, maximumAge: 0, timeout: 8000 };

function triggerMarkerFeedback(marker) {
  const element = marker && marker.getElement ? marker.getElement() : null;
  if (!element) return;
  element.classList.remove('marker-tap-feedback');
  void element.offsetWidth;
  element.classList.add('marker-tap-feedback');
  window.clearTimeout(marker._tapFeedbackTimer);
  marker._tapFeedbackTimer = window.setTimeout(() => {
    const currentElement = marker.getElement();
    if (currentElement) currentElement.classList.remove('marker-tap-feedback');
  }, 450);
}

function rememberUserLocation(position) {
  lastKnownUserLocation = {
    latlng: L.latLng(position.coords.latitude, position.coords.longitude),
    accuracy: Number(position.coords.accuracy) || null,
    timestamp: position.timestamp || Date.now()
  };
  return lastKnownUserLocation;
}

function ensureUserMarker(latlng) {
  if (userMarker) {
    userMarker.setLatLng(latlng);
    return userMarker;
  }

  userMarker = L.marker(latlng, {
    icon: makeUserLocationIcon(),
    interactive: true,
    keyboard: true,
    title: 'Tu ubicación',
    alt: 'Tu ubicación',
    zIndexOffset: 900
  }).addTo(map);
  userMarker.bindTooltip('Aquí estás tú', {
    className: 'user-location-tooltip',
    direction: 'top',
    offset: [0, 0],
    opacity: 1
  });
  userMarker.on('click', function() {
    this.openTooltip();
    triggerMarkerFeedback(this);
  });
  return userMarker;
}

function showUserLocation(location, options = {}) {
  const { center = false, feedback = false } = options;
  const marker = ensureUserMarker(location.latlng);
  if (center) {
    map.setView(location.latlng, Math.max(map.getZoom(), 14), { animate: true });
  }
  if (feedback) triggerMarkerFeedback(marker);
}

function setLocateLoading(loading) {
  if (!locateButtonElement) return;
  locateButtonElement.classList.toggle('is-locating', loading);
  locateButtonElement.setAttribute('aria-busy', String(loading));
}

function refineUserLocation(requestId) {
  navigator.geolocation.getCurrentPosition(position => {
    if (requestId !== locationRequestSequence) return;
    const location = rememberUserLocation(position);
    showUserLocation(location, { center: true });
  }, () => {}, PRECISE_LOCATION_OPTIONS);
}

function requestUserLocation() {
  const requestId = ++locationRequestSequence;
  const hadRememberedLocation = Boolean(lastKnownUserLocation);

  if (hadRememberedLocation) {
    showUserLocation(lastKnownUserLocation, { center: true, feedback: true });
  }

  if (!navigator.geolocation) {
    if (!hadRememberedLocation) alert("No se pudo obtener tu ubicación. Por favor, revisa los permisos.");
    return;
  }

  setLocateLoading(true);
  navigator.geolocation.getCurrentPosition(position => {
    if (requestId !== locationRequestSequence) return;
    const location = rememberUserLocation(position);
    showUserLocation(location, { center: true, feedback: !hadRememberedLocation });
    setLocateLoading(false);
    if (location.accuracy !== null && location.accuracy > 200) refineUserLocation(requestId);
  }, () => {
    if (requestId !== locationRequestSequence) return;
    setLocateLoading(false);
    if (!hadRememberedLocation) alert("No se pudo obtener tu ubicación. Por favor, revisa los permisos.");
  }, FAST_LOCATION_OPTIONS);
}

// Si el usuario ya concedió permiso, se prepara una coordenada rápida sin mover el mapa
// ni provocar un diálogo de permisos durante la carga.
(function preloadPermittedLocation() {
  if (!navigator.geolocation || !navigator.permissions || !navigator.permissions.query) return;
  navigator.permissions.query({ name: 'geolocation' }).then(permission => {
    if (permission.state !== 'granted') return;
    navigator.geolocation.getCurrentPosition(rememberUserLocation, () => {}, FAST_LOCATION_OPTIONS);
  }).catch(() => {});
})();

// ─────────────────────────────────────────────
//  SLUGS — deben ser IDÉNTICOS a build.py para que
//  las URLs del panel coincidan con las páginas generadas.
// ─────────────────────────────────────────────
const BASE_URL = 'https://bibliotecasmadrid.es/';
const PREFIJOS = ["biblioteca pública ", "biblioteca municipal ", "salas de estudio ",
  "sala de estudio del ", "sala de estudio de la ", "sala de estudio ", "sala de lectura ", "biblioteca "];

function slugify(nombre) {
  let base = nombre;
  const low = nombre.toLowerCase();
  for (const p of PREFIJOS) { if (low.startsWith(p)) { base = nombre.slice(p.length); break; } }
  base = base.normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase();
  base = base.replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  return base || 'centro';
}

const slugOf = new Map(), placeOf = new Map();
(function buildSlugs() {
  const seen = {};
  lugares.forEach(d => {
    let s = slugify(d.nombre);
    if (seen[s]) { seen[s]++; s = s + '-' + seen[s]; } else { seen[s] = 1; }
    slugOf.set(d, s); placeOf.set(s, d);
  });
})();

const LIBCAL_INSTITUTIONS = {

function getLibcalIid(d) {
  if (d.libcal_iid) return d.libcal_iid;
  if (!d.libcal_lid) return null;
  if (/ucm/i.test(d.nombre) || (d.web && d.web.includes('biblioagenda.ucm.es'))) return 4031;
  return 3941;
}

function format12to24(timeStr) {
  if (!timeStr) return '';
  const m = timeStr.trim().match(/^(\d{1,2})(?::(\d{2}))?\s*(am|pm)?$/i);
  if (!m) return timeStr;
  let h = parseInt(m[1], 10);
  const min = m[2] ? m[2] : '00';
  const ampm = m[3] ? m[3].toLowerCase() : null;
  if (ampm === 'pm' && h < 12) h += 12;
  if (ampm === 'am' && h === 12) h = 0;
  return `${h}:${min}`;
}

function parseLibCalTimes(times, rendered) {
  if (!times && !rendered) return null;
  const status = times ? times.status : null;
  const isClosed = status === 'closed' || (status === 'text' && /cerrad/i.test(rendered || times.text || '')) || /cerrad/i.test(rendered || '');
  
  if (isClosed) {
    return {
      isOpen: false,
      statusText: 'Cerrado',
      statusClass: 'status-closed',
      todaySchedule: 'Cerrado hoy'
    };
  }

  if (status === 'open' && times.hours && times.hours.length > 0) {
    const formattedHours = times.hours.map(h => `${format12to24(h.from)}–${format12to24(h.to)}h`).join(' y ');
    const isOpen = !!times.currently_open;
    return {
      isOpen,
      statusText: isOpen ? 'Abierto' : 'Cerrado',
      statusClass: isOpen ? 'status-open' : 'status-closed',
      todaySchedule: formattedHours
    };
  }

  if (rendered && /\d/.test(rendered)) {
    return {
      isOpen: times ? !!times.currently_open : null,
      statusText: (times && times.currently_open) ? 'Abierto' : 'Horario especial',
      statusClass: (times && times.currently_open) ? 'status-open' : 'status-info',
      todaySchedule: rendered
    };
  }

  return null;
}

function fetchLibCalToday(iid) {
  if (!iid || !LIBCAL_INSTITUTIONS[iid]) return Promise.resolve(null);
  if (libcalLiveToday[iid]) return Promise.resolve(libcalLiveToday[iid]);
  if (libcalFetchTodayPromises[iid]) return libcalFetchTodayPromises[iid];

  const config = LIBCAL_INSTITUTIONS[iid];
  libcalFetchTodayPromises[iid] = fetch(config.todayApi)
    .then(r => {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(data => {
      libcalLiveToday[iid] = {};
      if (data && data.locations) {
        data.locations.forEach(loc => {
          libcalLiveToday[iid][loc.lid] = loc;
        });
      }
      return libcalLiveToday[iid];
    })
    .catch(err => {
      console.warn(`${config.name} en vivo no disponible:`, err);
      return null;
    });

  return libcalFetchTodayPromises[iid];
}

function fetchLibCalGrid(iid) {
  if (!iid || !LIBCAL_INSTITUTIONS[iid]) return Promise.resolve(null);
  if (libcalLiveGrid[iid]) return Promise.resolve(libcalLiveGrid[iid]);
  if (libcalFetchGridPromises[iid]) return libcalFetchGridPromises[iid];

  const config = LIBCAL_INSTITUTIONS[iid];
  libcalFetchGridPromises[iid] = fetch(config.gridApi)
    .then(r => {
      if (!r.ok) throw new Error('HTTP ' + r.status);

    })
    .catch(err => {

    });

  return libcalFetchGridPromises[iid];
}

// Cover del panel lateral. Aqui se quiere el INTERIOR (la sala de estudio); el
// exterior del edificio es lo que usa la ficha <slug>.html que genera build.py.
// Si un centro aun no tiene interior, su propio exterior es mejor respuesta que
// una foto generica de otra biblioteca, asi que el pool queda de ultimo recurso.
function getPlaceImage(d) {
  if (d.foto_interior) return d.foto_interior;
  if (d.foto) return d.foto;
  const pool = PHOTO_POOLS[d.tipo] || PHOTO_POOLS.biblioteca;
  let hash = 0;
  for (let i = 0; i < d.nombre.length; i++) hash = (hash << 5) - hash + d.nombre.charCodeAt(i);
  const idx = Math.abs(hash) % pool.length;
  return pool[idx];
}

// Calendario diario compilado: resuelve el estado sin leer el texto editorial.
let calendarReady = false;
let calendarLoadPromise = null;

function calendarDateLabel(date = new Date()) {
  return Horarios.dayLabel(Horarios.dateKey(date));
}

function ensureCalendarWindow(date = new Date(), days = 7) {
  const start = Horarios.dateKey(date);
  const months = new Map();
  for (let i = 0; i < days; i++) {
    const parts = Horarios.addDays(start, i).slice(0, 7).split('-').map(Number);
    months.set(parts.join('-'), parts);
  }
  const request = Promise.all([...months.values()].map(([year, month]) => Horarios.ensureMonth(year, month)));
  calendarLoadPromise = request.then(() => {
    calendarReady = true;
    return true;
  }).catch(error => {
    console.warn('No se pudo cargar el calendario interno', error);
    return false;
  });
  return calendarLoadPromise;
}

function getTodayInfo(d, date = new Date()) {
  const dateKey = Horarios.dateKey(date);
  const dateFormatted = calendarDateLabel(date);
  const iid = getLibcalIid(d);
  if (d.libcal_lid && iid && libcalLiveToday[iid] && libcalLiveToday[iid][d.libcal_lid]) {
    const loc = libcalLiveToday[iid][d.libcal_lid];
    const liveParsed = parseLibCalTimes(loc.times, loc.rendered);
    if (liveParsed) return { dateFormatted, ...liveParsed, entry: null };
  }

  const entry = Horarios.getEntry(slugOf.get(d), dateKey);
  if (!entry) {
    return {
      dateFormatted,
      statusText: 'Cargando',
      statusClass: 'status-info',
      todaySchedule: 'Cargando calendario…',
      isOpen: null,
      isLoading: true,
      entry: null
    };
  }
  const shown = Horarios.displayFor(entry, dateKey, date);
  return {
    dateFormatted,
    statusText: shown.statusText,
    statusClass: shown.statusClass,
    todaySchedule: shown.hoursText,
    isOpen: shown.isOpen,
    entry,
    isLive: false
  };
}

function escapeCalendarText(value) {
  return String(value || '').replace(/[&<>"']/g, character => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[character]));
}

function weekHours(entry) {
  if (!entry) return 'Consultar';
  if (entry.estado === 'abierto') return Horarios.formatIntervals(entry.intervalos);
  if (entry.estado === 'consultar') return 'Consultar';
  return 'Cerrado';
}

function renderCalendarWeek(d, containerEl) {
  if (!containerEl) return;
  const now = new Date();
  const todayKey = Horarios.dateKey(now);
  containerEl.innerHTML = '<div class="panel-label" style="margin-top:8px; margin-bottom:4px; font-size:9.5px;">Próximos 7 días</div><div class="panel-week-loading">Cargando calendario…</div>';
  Horarios.getWeek(slugOf.get(d), now, 7).then(days => {
    if (current !== d || !containerEl.isConnected) return;
    const rows = days.map(({ key, entry }) => {
      const today = key === todayKey;
      const note = entry && entry.nota ? ` title="${escapeCalendarText(entry.nota)}"` : '';
      return `<tr data-calendar-date="${key}" class="${today ? 'day-row-today' : ''}">
        <td${note}>${escapeCalendarText(Horarios.dayLabel(key))}${today ? ' (Hoy)' : ''}</td>
        <td class="day-hours">${escapeCalendarText(weekHours(entry))}</td>
      </tr>`;
    }).join('');
    containerEl.innerHTML = `
      <div class="panel-label panel-calendar-week-label" style="margin-top:8px; margin-bottom:4px; font-size:9.5px;">Próximos 7 días</div>
      <table class="panel-week-table"><tbody>${rows}</tbody></table>`;
    renderLibCalWeek(d, containerEl);
  }).catch(() => {
    if (current === d && containerEl.isConnected) {
      containerEl.innerHTML = '<div class="panel-label" style="margin-top:8px; margin-bottom:4px; font-size:9.5px;">Próximos 7 días</div><div class="panel-week-loading">No se pudo cargar el calendario.</div>';
    }
  });
}

// Actualiza las filas de respaldo con LibCal cuando el centro lo ofrece.
// Si la API falla o no incluye un día, el calendario interno ya renderizado se conserva.
function renderLibCalWeek(d, containerEl) {
  const iid = getLibcalIid(d);
  if (!d.libcal_lid || !iid || !containerEl) return;
  fetchLibCalGrid(iid).then(grid => {
    if (!grid || !grid[d.libcal_lid] || current !== d || !containerEl.isConnected) return;
    const location = grid[d.libcal_lid];
    for (const week of location.weeks || []) {
      for (const dayInfo of Object.values(week || {})) {
        if (!dayInfo || !dayInfo.date) continue;
        const row = containerEl.querySelector(`[data-calendar-date="${dayInfo.date}"]`);
        if (!row) continue;
        const cell = row.querySelector('.day-hours');
        if (!cell) continue;
        let text = 'Cerrado';
        if (dayInfo.times && dayInfo.times.status === 'open' && dayInfo.times.hours) {
          text = dayInfo.times.hours.map(hours => `${format12to24(hours.from)}–${format12to24(hours.to)}h`).join(' y ');
        } else if (dayInfo.rendered && !/cerrad/i.test(dayInfo.rendered) && /\d/.test(dayInfo.rendered)) {
          text = dayInfo.rendered;
        }
        cell.textContent = text;
      }
    }
  }).catch(() => {});
}

function sourceNameForPlace(d) {
  const iid = getLibcalIid(d);
  if (d.libcal_lid && iid && LIBCAL_INSTITUTIONS[iid]) return LIBCAL_INSTITUTIONS[iid].name;
  if (!d.web) return 'Fuente oficial';
  try {

let current = null;
let selectedMarker = null;
const MOBILE_PANEL_MEDIA = MOBILE_UI_MEDIA;
const URL_PLACE_MIN_ZOOM = 16;

function setSelectedMarker(d) {
  if (selectedMarker) {
    selectedMarker.setIcon(makeIcon(selectedMarker._placeData.tipo));
    selectedMarker.setZIndexOffset(0);
  }

  selectedMarker = d ? markerOfPlace.get(d) : null;
  if (selectedMarker) {
    selectedMarker.setIcon(makeSelectedIcon(d.tipo));
    selectedMarker.setZIndexOffset(1000);
  }
}

// Situa el centro en el punto medio de la parte del mapa que el panel no tapa.
// Se proyecta la coordenada al zoom final para que un zoom animado no deshaga el offset.
function focusPlace(d, minZoom = null) {
  if (!d) return;
  const size = map.getSize();
  if (!size.x || !size.y) return;

  const zoom = minZoom === null ? map.getZoom() : Math.max(map.getZoom(), minZoom);
  const targetPoint = MOBILE_PANEL_MEDIA.matches
    ? L.point(size.x / 2, (size.y - panel.offsetHeight) / 2)
    : L.point((size.x - panel.offsetWidth) / 2, size.y / 2);
  const centerOffset = L.point(size.x / 2 - targetPoint.x, size.y / 2 - targetPoint.y);
  const projectedPlace = map.project([d.lat, d.lng], zoom);
  const center = map.unproject(projectedPlace.add(centerOffset), zoom);
  map.setView(center, zoom, { animate: true });
}

// El buscador puede partir de un cluster. Se espera a que Leaflet revele el marcador y
// solo entonces se aplica el offset; el temporizador cubre callbacks que markercluster
// omite cuando el marcador emerge sin llegar a spiderfy.
function focusAfterMarkerReveal(d, marker) {
  let focused = false;
  const finish = () => {
    if (focused || current !== d) return;
    focused = true;
    focusPlace(d);
  };

  clusterGroup.zoomToShowLayer(marker, finish);
  window.setTimeout(finish, 700);
}

function openPlace(d, push, options = {}) {
  const { focus = true, minZoom = null } = options;
  current = d;
  setSelectedMarker(d);
  panelBody.innerHTML = panelHtml(d);
  panelBody.scrollTop = 0;
  panel.classList.add('open');
  panel.setAttribute('aria-hidden', 'false');
  document.body.classList.add('place-panel-open');
  document.getElementById('panel-close').focus();
  if (push) history.pushState({ slug: slugOf.get(d) }, '', slugOf.get(d));
  if (focus) {
    window.requestAnimationFrame(() => {
      if (current === d) focusPlace(d, minZoom);
    });
  }

  ensureCalendarWindow(new Date(), 7).then(loaded => {
    if (!loaded || current !== d) return;
    panelBody.innerHTML = panelHtml(d);
    const calendarContainer = document.getElementById('panel-calendar-week');
    if (calendarContainer) renderCalendarWeek(d, calendarContainer);
    if (openNowActive) refreshVisibleMarkers();
  });

  if (d.libcal_lid) {
    const iid = getLibcalIid(d);
    if (iid && (!libcalLiveToday[iid] || !libcalLiveToday[iid][d.libcal_lid])) {
      fetchLibCalToday(iid).then(() => {
        if (current === d) {
          const today = getTodayInfo(d);
          const headEl = document.getElementById('panel-today-container');
          if (headEl) {
            const badge = headEl.querySelector('.status-badge');
            if (badge) {
              badge.className = `status-badge ${today.statusClass}`;
              badge.textContent = today.statusText;
            }
            const hours = headEl.querySelector('.panel-today-hours');
            if (hours) {
              hours.textContent = today.todaySchedule;
            }
          }
        }
      });
    }

  }

  const calendarContainer = document.getElementById('panel-calendar-week');
  if (calendarContainer) renderCalendarWeek(d, calendarContainer);
}
function closePanel(push) {
  const closingPlace = current;
  panelDragState = null;
  panel.classList.remove('dragging');
  panel.style.removeProperty('transform');
  setSelectedMarker(null);
  current = null;
  panel.classList.remove('open');
  panel.setAttribute('aria-hidden', 'true');
  document.body.classList.remove('place-panel-open');
  document.getElementById('map').focus();
  if (closingPlace && MOBILE_PANEL_MEDIA.matches) {
    map.setView([closingPlace.lat, closingPlace.lng], map.getZoom(), { animate: true });
  }
  if (push) history.pushState({}, '', './');
}

document.getElementById('panel-close').addEventListener('click', () => closePanel(true));
document.addEventListener('keydown', e => { if (e.key === 'Escape' && current) closePanel(true); });
map.on('click', () => {
  if (performance.now() < suppressMapCloseUntil) return;
  if (current) closePanel(true);
});

let panelDragState = null;
const PANEL_DISMISS_DISTANCE = 96;
const PANEL_DISMISS_FAST_DISTANCE = 32;
const PANEL_DISMISS_VELOCITY = 0.6;
const PANEL_DRAG_INTERACTIVE = 'a, button, input, select, textarea, [role="button"]';

function finishPanelDrag(shouldClose) {
  if (!panelDragState || !panelDragState.dragging) {
    panelDragState = null;
    return;
  }

  panelDragState = null;
  panel.classList.remove('dragging');
  window.requestAnimationFrame(() => {
    if (shouldClose && current) {
      closePanel(true);
    } else {
      panel.style.removeProperty('transform');
    }
  });
}

panel.addEventListener('touchstart', event => {
  if (!MOBILE_PANEL_MEDIA.matches || !current || event.touches.length !== 1) return;
  const target = event.target;
  const fromHandle = target.closest('.panel-drag-handle');
  if (!fromHandle && target.closest(PANEL_DRAG_INTERACTIVE)) return;
  if (!fromHandle && panelBody.scrollTop > 0) return;

  const touch = event.touches[0];
  panelDragState = {
    startX: touch.clientX,
    startY: touch.clientY,
    lastY: touch.clientY,
    lastTime: performance.now(),
    velocity: 0,
    distance: 0,
    dragging: false,
    fromHandle: Boolean(fromHandle)
  };
}, { passive: true });

panel.addEventListener('touchmove', event => {
  if (!panelDragState || event.touches.length !== 1) return;
  const touch = event.touches[0];
  const deltaX = touch.clientX - panelDragState.startX;
  const deltaY = touch.clientY - panelDragState.startY;

  if (!panelDragState.dragging) {
    if (Math.max(Math.abs(deltaX), Math.abs(deltaY)) < 6) return;
    if (deltaY <= 0 || Math.abs(deltaX) > Math.abs(deltaY)) {
      panelDragState = null;
      return;
    }
    if (!panelDragState.fromHandle && panelBody.scrollTop > 0) {
      panelDragState = null;
      return;
    }
    panelDragState.dragging = true;
    panel.classList.add('dragging');
  }

  event.preventDefault();
  const now = performance.now();
  const elapsed = Math.max(1, now - panelDragState.lastTime);
  panelDragState.velocity = (touch.clientY - panelDragState.lastY) / elapsed;
  panelDragState.lastY = touch.clientY;
  panelDragState.lastTime = now;
  panelDragState.distance = Math.max(0, deltaY);
  panel.style.transform = `translateY(${panelDragState.distance}px)`;
}, { passive: false });

panel.addEventListener('touchend', () => {
  if (!panelDragState) return;
  const velocityIsRecent = performance.now() - panelDragState.lastTime < 100;
  const fastEnough = velocityIsRecent
    && panelDragState.velocity >= PANEL_DISMISS_VELOCITY
    && panelDragState.distance >= PANEL_DISMISS_FAST_DISTANCE;
  finishPanelDrag(panelDragState.distance >= PANEL_DISMISS_DISTANCE || fastEnough);
});

panel.addEventListener('touchcancel', () => finishPanelDrag(false));

let focusResizeTimer = null;
window.addEventListener('resize', () => {
  window.clearTimeout(focusResizeTimer);
  focusResizeTimer = window.setTimeout(() => {
    if (current && panel.classList.contains('open')) focusPlace(current);
  }, 120);
});

const clusterGroup = L.markerClusterGroup({
  maxClusterRadius: 45,
  spiderfyOnMaxZoom: true,
  showCoverageOnHover: false,
  zoomToBoundsOnClick: true,
  disableClusteringAtZoom: 16
});

const allMarkers = [];
const markerOfPlace = new Map();

lugares.forEach(d => {
  const marker = L.marker([d.lat, d.lng], { icon: makeIcon(d.tipo), title: d.nombre })
    .on('click', function() {
      openPlace(d, true);
      triggerMarkerFeedback(this);
    });
  marker._placeData = d;
  allMarkers.push(marker);
  markerOfPlace.set(d, marker);
  clusterGroup.addLayer(marker);
});

map.addLayer(clusterGroup);

// ── Filtro por tipo y "Abierto ahora" ────────
const hiddenTypes = new Set();
let openNowActive = false;

function refreshVisibleMarkers() {
  if (openNowActive && !calendarReady) {
    ensureCalendarWindow(new Date(), 1).then(loaded => {
      if (loaded && openNowActive) refreshVisibleMarkers();
    });
  }
  clusterGroup.clearLayers();
  allMarkers.forEach(marker => {
    const d = marker._placeData;
    if (hiddenTypes.has(d.tipo)) return;
    if (openNowActive && calendarReady) {
      const info = getTodayInfo(d);
      if (info.isOpen !== true) return;
    }
    clusterGroup.addLayer(marker);
  });
}

document.querySelectorAll('.legend-item').forEach(item => {
  item.style.cursor = 'pointer';
  item.title = "Haz clic para mostrar/ocultar";
  item.addEventListener('click', () => {
    const type = item.dataset.type;
    if (hiddenTypes.has(type)) {
      hiddenTypes.delete(type);
      item.style.opacity = '1';
    } else {
      hiddenTypes.add(type);
      item.style.opacity = '0.4';
    }
    refreshVisibleMarkers();
  });
});

const openNowBtn = document.getElementById('open-now-btn');
openNowBtn.addEventListener('click', () => {
  openNowActive = !openNowActive;
  openNowBtn.classList.toggle('active', openNowActive);
  openNowBtn.innerHTML = openNowActive
    ? '<span class="pulse-dot"></span> Mostrar todos'
    : '<span class="pulse-dot"></span> Abierto ahora';
  refreshVisibleMarkers();
});

// ── Cuenta atrás al cierre ───────────────────
// Cuenta atras basada directamente en los intervalos del calendario compilado.
function getCountdown(d) {
  const info = getTodayInfo(d);
  if (!info.isOpen || !info.entry || !info.entry.intervalos) return null;
  const now = Horarios.madridParts(new Date());
  const currentMin = now.hour * 60 + now.minute;
  let closingMin = null;
  for (const [, end] of info.entry.intervalos) {
    const [hour, minute] = end.split(':').map(Number);
    const endMin = hour * 60 + minute;
    if (currentMin < endMin) {
      closingMin = endMin;
      break;
    }
  }
  if (closingMin === null) return null;
  const diffMin = closingMin - currentMin;
  const hrs = Math.floor(diffMin / 60);
  const mins = diffMin % 60;
  return {
    text: hrs > 0 ? `Cierra en ${hrs}h ${mins}min` : `Cierra en ${mins} min`,
    closingSoon: diffMin <= 60
  };
}

function placeFromUrl() {
  let slug = location.hash.slice(1);
  if (!slug) {
    const path = location.pathname.replace(/\/+$/, '');
    slug = path.substring(path.lastIndexOf('/') + 1);
  }
  return placeOf.get(decodeURIComponent(slug)) || null;
}

function placeFromMapFocusQuery() {
  const slug = new URLSearchParams(location.search).get('centro');
  return slug ? placeOf.get(slug) || null : null;
}

// Entrada desde la ficha móvil: centra el centro a nivel de calle, pero conserva el
// mapa completamente visible y el panel cerrado.
function focusPlaceWithoutPanel(d) {
  if (!d) return;
  if (current) {
    closePanel(false);
  } else {
    setSelectedMarker(null);
    panel.classList.remove('open');
    panel.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('place-panel-open');
  }

  map.setView([d.lat, d.lng], URL_PLACE_MIN_ZOOM, { animate: false });
  const marker = markerOfPlace.get(d);
  window.setTimeout(() => triggerMarkerFeedback(marker), 120);
}

window.addEventListener('popstate', () => {
  const focusOnly = placeFromMapFocusQuery();
  if (focusOnly) {
    focusPlaceWithoutPanel(focusOnly);
    return;
  }
  const d = placeFromUrl();
  if (d) openPlace(d, false, { minZoom: URL_PLACE_MIN_ZOOM }); else closePanel(false);
});
(function initFromUrl() {
  const focusOnly = placeFromMapFocusQuery();
  if (focusOnly) {
    focusPlaceWithoutPanel(focusOnly);
    history.replaceState({ focusSlug: slugOf.get(focusOnly) }, '', location.href);
    return;
  }
  const d = placeFromUrl();
  if (d) {
    openPlace(d, false, { minZoom: URL_PLACE_MIN_ZOOM });
    history.replaceState({ slug: slugOf.get(d) }, '', slugOf.get(d));
  }
})();

// ─────────────────────────────────────────────
//  SEO: datos estructurados (ItemList) generados
//  desde el propio array, sin duplicar datos.
// ─────────────────────────────────────────────
(function injectStructuredData() {
  const itemList = {
    "@context": "https://schema.org",
    "@type": "ItemList",
    "name": "Bibliotecas y salas de estudio en Madrid",
    "numberOfItems": lugares.length,
    "itemListElement": lugares.map((d, i) => ({
      "@type": "ListItem",
      "position": i + 1,
      "item": {
        "@type": "Library",
        "name": d.nombre,
        "description": "Horario: " + d.horario.replace(/\n/g, ' '),
        "address": {
          "@type": "PostalAddress",
          "streetAddress": d.direccion,
          "addressLocality": "Madrid",
          "addressRegion": "Comunidad de Madrid",
          "addressCountry": "ES"
        },
        "geo": { "@type": "GeoCoordinates", "latitude": d.lat, "longitude": d.lng },
        "maximumAttendeeCapacity": d.plazas,
        "url": BASE_URL + slugOf.get(d)
      }
    }))
  };
  const s = document.createElement('script');
  s.type = 'application/ld+json';
  s.textContent = JSON.stringify(itemList);
  document.head.appendChild(s);
})();

// Refresco automático de estado en vivo cada 60 segundos (cambio de hora / medianoche)
ensureCalendarWindow(new Date(), 7).then(loaded => {
  if (loaded && openNowActive) refreshVisibleMarkers();
  if (loaded && current && panel.classList.contains('open')) {
    panelBody.innerHTML = panelHtml(current);
    const week = document.getElementById('panel-calendar-week');
    if (week) renderCalendarWeek(current, week);
  }
});
setInterval(() => {
  ensureCalendarWindow(new Date(), 7).then(() => {
    if (openNowActive) refreshVisibleMarkers();
    if (current && panel.classList.contains('open')) {
      panelBody.innerHTML = panelHtml(current);
      const week = document.getElementById('panel-calendar-week');
      if (week) renderCalendarWeek(current, week);
    }
  });
}, 60000);
