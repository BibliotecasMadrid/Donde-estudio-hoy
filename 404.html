<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página no encontrada · Dónde estudiar en Madrid</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#2563EB">
  <link rel="icon" href="/icons/icon-192.png">
  <style>
    :root {
      --c-biblioteca: #2563EB;
      --ink:   #1A1F36;
      --ink-2: #5A6172;
      --bg:    #EAEDF0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .caja {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(26,31,54,.10);
      padding: 40px 32px;
      max-width: 460px;
      text-align: center;
    }
    .marca { font-size: 44px; line-height: 1; margin-bottom: 16px; }
    h1 { font-size: 21px; margin: 0 0 10px; letter-spacing: -.01em; }
    p { margin: 0 0 24px; color: var(--ink-2); font-size: 15px; line-height: 1.55; }
    a.boton {
      display: inline-block;
      background: var(--c-biblioteca);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      padding: 12px 24px;
      border-radius: 10px;
    }
    a.boton:hover { background: #1D4FD7; }
  </style>
</head>
<body>
  <main class="caja">
    <div class="marca">📚</div>
    <h1>Aquí no hay nada que estudiar</h1>
    <p>Esta página no existe. Puede que el centro haya cambiado de nombre o que la dirección esté mal escrita.</p>
    <a class="boton" href="/">Volver al mapa</a>
  </main>
</body>
</html>
